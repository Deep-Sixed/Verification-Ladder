# Copy to the root of a repository the Verification Ladder should govern, then
# make it true for that project. Every value here is a claim about what must
# hold before a change is complete, so it belongs under review like any other.
#
# A repository with no policy is BLOCKED, never silently verified.

# Gates that must PASS by EXECUTION. An agent attestation can never satisfy one -
# that is the difference between "a check ran" and "an agent believes it would
# have passed". Name every gate here, including the ones only CI can run.
required_gates = ["lint", "tests"]

# Rungs of the ladder that are judgments rather than executions. They must be
# attested for the state under composition, and they satisfy nothing else.
judgment_rungs = ["task", "diff", "self-review", "requirements", "architecture", "fresh-review"]

# CI run events whose checkout IS the commit under verification. A pull_request
# run checks out a synthetic merge of head into base, so its results describe
# that merge and not the branch tip its payload names.
ci_head_events = ["push"]

# What this checkout can execute, in the order it should run. Use the commands a
# contributor runs locally, exactly as they would type them.
[gates.local]
lint = "ruff check ."
tests = "python -m pytest -q"

# Gates only CI can establish, mapped to the workflow step that establishes each.
# The step name is what the Actions API reports: an unnamed `run:` step appears
# as "Run <command>". Several gates may rest on one step when that step runs
# several checks; a failed step then establishes none of them.
[ci_steps]
lint = "Run ruff check ."
tests = "Run python -m pytest -q"
# container-build = "Run docker build -t app:ci ."

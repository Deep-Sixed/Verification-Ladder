# Copy to the root of a repository the Verification Ladder should govern, then
# make it true for that project. Every value here is a claim about what must
# hold before a change is complete, so it belongs under review like any other.
#
# A repository with no policy is BLOCKED, never silently verified.

# Which evidence contract decides here. Omit it for the default,
# "verification.ladder.evidence/2". Adopting evidence/3 takes this line AND an
# activation record in each checkout (`verify.py qualify`, then
# `verify.py activate`) - the line is committed so the contract survives
# `rm -rf .verification` and a fresh clone, and the record is not, because
# qualification is a property of a working copy rather than of a commit. With
# the line and no record, evidence is still produced and marked pre-activation,
# and `compose` is BLOCKED until you activate.
# evidence = "verification.ladder.evidence/3"

# Gates that must PASS by EXECUTION. An agent attestation can never satisfy one -
# that is the difference between "a check ran" and "an agent believes it would
# have passed". Name every gate here, including the ones only CI can run.
required_gates = ["lint", "tests"]

# Rungs of the ladder that are judgments rather than executions. They must be
# attested for the state under composition, and they satisfy nothing else.
judgment_rungs = ["task", "diff", "self-review", "requirements", "architecture", "fresh-review"]

# CI run events whose checkout IS the commit under verification. A pull_request
# run checks out a synthetic merge of head into base, so its results describe
# that merge and not the branch tip its payload names.
ci_head_events = ["push"]

# What this checkout can execute, in the order it should run. Use the commands a
# contributor runs locally, exactly as they would type them.
#
# These two examples assume the caches they create - __pycache__/, *.py[cod],
# .pytest_cache/, .ruff_cache/ - are git-ignored. They are not, by default: a
# gate whose output lands in the tree moves the state it is being measured
# against, and the run reports BLOCKED on drift with every gate passing.
# INSTALL.md lists the set to ignore. Ignore disposable tool output only - a gate
# that reformats source, updates a lockfile or regenerates checked-in code has
# changed repository state, and drift is then the correct, intended answer.
#
# `python -m pytest -q` exits 5 when it collects no tests, which reads as FAIL.
# That is accurate for a project with no tests yet: tailor this policy to what
# the project actually requires, as part of the reviewed change that adopts it.
# Do not redefine "nothing ran" as success.
[gates.local]
lint = "ruff check ."
tests = "python -m pytest -q"

# Which repository, workflow and job may establish a CI gate. REQUIRED whenever
# [ci_steps] below declares one: `import-ci` refuses a payload it cannot bind,
# and with these undeclared there is nothing to bind the repository, workflow and
# job links against - so a green run from an unrelated repository satisfies the
# gate. Declared here rather than read from the payload: checking a run's
# workflow against the workflow that same run claims compares a value with
# itself and passes for any payload at all.
#
# Changing these is a completion-contract change, and composition reports
# DEFINITION CHANGE PENDING rather than a clean climb - repointing this at the
# fork a green run happens to come from is exactly the edit that needs review.
[ci]
repository = "acme/widget"
workflow = ".github/workflows/ci.yml"
job = "validate"

# Gates only CI can establish, mapped to the workflow step that establishes each.
# The step name is what the Actions API reports: an unnamed `run:` step appears
# as "Run <command>". Several gates may rest on one step when that step runs
# several checks; a failed step then establishes none of them.
[ci_steps]
lint = "Run ruff check ."
tests = "Run python -m pytest -q"
# container-build = "Run docker build -t app:ci ."

# --- evidence/3, shadow only ------------------------------------------------
#
# Optional, and it establishes nothing. Everything under [shadow] describes how
# the executions declared above are read under `verification.ladder.evidence/3`,
# which is not authoritative (see docs/design/evidence-v3.md §M). A declaration
# here cannot run a command, cannot satisfy a required gate, and cannot change a
# verdict or an exit code. Delete the whole section and nothing about the result
# changes; keep it and `verify.py compare` can tell you whether evidence/3 would
# have read your executions the way v2 did.
#
# A gate named here is described ENTIRELY here: the shadow declaration replaces
# that gate's [gates.local] / [ci_steps] entries in the evidence/3 view rather
# than merging into them. So authority stays declared - a gate has `ci` authority
# only where [shadow.gates.ci.<name>] says so, never because it is behavioural.
#
# A gate declared here that nothing above executes stays unpaired. It does not
# become executable by being written down.

# The runtime dimension, read from a JSON object rather than probed: a shadow
# declaration that ran a command to collect runtime facts would be creating
# execution. Absent or unreadable means the runtime cannot be interrogated,
# which is BLOCKED at comparison time and a missing dimension at record time.
# Keep it out of the tracked tree, or moving the runtime also moves the
# repository state and the two dimensions stop being separable.
# [shadow.runtime]
# facts_file = ".verification/runtime.json"

# A behavioural gate: the machine establishes that the path ran and produced
# these artifacts, an attestation establishes that someone read what they show,
# and neither absorbs the other. `spec_files` are the declared definition of what
# this gate means - declared, never observed, because an agent reading Markdown
# cannot be watched. Artifact paths belong under .verification/, which is
# excluded from repository state by construction.
# [shadow.gates.behavioral.verify-login]
# driver = "node drive-login.mjs"
# target = ["repository", "runtime"]
# evidence_mode = "execution+attestation"
# spec_root = "docs/journeys"
# spec_files = ["docs/journeys/login.md"]
# artifacts = [".verification/artifacts/login-journey.json"]

# [shadow.ci] used to hold the provenance expectations and is still read, for
# policies written while evidence/3 had no authority. Prefer the [ci] table
# above: a requirement kept in a section documented as establishing nothing is a
# requirement nobody treats as one, and it was optional for exactly that reason.

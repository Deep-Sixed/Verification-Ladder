name: verification-ladder
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.14
      - run: python -m pip install uv==0.11.29
      # Step names are the contract: verification.toml maps each gate to the name
      # the Actions API reports, which for an unnamed `run:` step is "Run <command>".
      # Renaming a step here without updating that map turns a gate MISSING.
      - run: uv run --with ruff==0.16.8 ruff check .
      - run: uv run --python 3.11 --with pytest==9.1.1 python -m pytest -q
      - run: uv run --python 3.14 --with pytest==9.1.1 python -m pytest -q

[project]
name = "verification-ladder"
version = "0.3.0"
description = "A portable verification procedure and evidence machinery for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Deep-Sixed" }]
# The skill ships as files an agent reads and runs, not as an installed package.
# verify.py depends on the standard library and git alone, so a checkout of this
# repository is a working installation on any machine with Python 3.11+.
dependencies = []

[dependency-groups]
# Pinned, and pinned identically in verification.toml and the workflow: a gate
# whose tool floats is a gate whose result is not reproducible.
dev = ["pytest==9.1.1", "ruff==0.16.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `network` marks the install cases that reach `git fetch origin` against the
# real GitHub origin. Everything else runs offline, so an air-gapped or
# network-denied run is `pytest -m "not network"` rather than a guess at which
# failures are environmental.
markers = ["network: requires a live fetch from the GitHub origin"]

[tool.ruff]
line-length = 120
